# Builds the prototype and publishes Storybook so that people and agents who are not
# on this machine can open the component library in a browser.
#
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# NOTE: Pages for a PRIVATE repository requires GitHub Pro/Team/Enterprise. If that is not
# available, either make the repository public, or point Cloudflare Pages / Netlify at this
# repository instead (they serve private repos on their free tiers) with:
#   build command: pnpm install --frozen-lockfile && pnpm build-storybook
#   output dir:    storybook-static
name: Storybook

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: token audit + tsc + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm check` runs tools/audit-tokens.mjs first: an undefined CSS variable silently
      # drops a whole declaration, so this is the guard that keeps a component from shipping
      # looking "empty" instead of broken (see design/PORT-LOG.md, trap 4).
      - run: pnpm check

  build:
    name: build Storybook
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
